name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - claude/eco-eurocamping-modernization-m244jr
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empuja dos veces seguidas, cancelamos la publicacion anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Construir el frontend
        # La base debe coincidir con el nombre del repositorio para que
        # GitHub Pages encuentre los archivos (usuario.github.io/<repo>/).
        run: ECO_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
